name: Release

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - name: Ensure npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@11
          npm --version
      - run: npm ci
      # release:check inspects the tarball, so dist/ must exist first.
      - run: npm run build
      - run: npm run release:check
      # prepublishOnly then runs typecheck, tests, the long fuzz pass, build, smoke tests and package lint.
      # Authenticates through trusted publishing (configured on npmjs.com for this repository,
      # release.yml and the npm environment); no token is stored anywhere.
      - run: npm publish --provenance --access public
