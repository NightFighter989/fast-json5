name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain (vitest, tsdown) needs Node 22.18+; older runtimes are covered by `smoke`.
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:pkg
      - name: Upload build for smoke tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke (${{ matrix.runtime }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtimes the package supports but the dev toolchain can't run on, plus Bun and Deno.
        runtime: [node-18, node-20, node-22, bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: startsWith(matrix.runtime, 'node-')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node-18' && 18 || matrix.runtime == 'node-20' && 20 || 22 }}
      - if: startsWith(matrix.runtime, 'node-')
        run: node test/smoke/smoke.mjs && node test/smoke/smoke.cjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun test/smoke/smoke.mjs && bun test/smoke/smoke.cjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read test/smoke/smoke.mjs
