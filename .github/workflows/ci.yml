name: CI

# One job, kept small: test on the oldest Node the dev toolchain supports, then smoke-test the
# built package on the older runtimes it promises to support. Docs-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest and tsdown need Node 22.18+.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:pkg

      # The published package supports Node 18+, Bun and Deno, which the toolchain can't run on,
      # so check the built dist/ there with the dependency-free smoke test (ESM and CJS).
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Smoke test (Node 18)
        run: node test/smoke/smoke.mjs && node test/smoke/smoke.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test (Node 20)
        run: node test/smoke/smoke.mjs && node test/smoke/smoke.cjs
      - uses: oven-sh/setup-bun@v2
      - name: Smoke test (Bun)
        run: bun test/smoke/smoke.mjs && bun test/smoke/smoke.cjs
      - uses: denoland/setup-deno@v2
      - name: Smoke test (Deno)
        run: deno run --allow-read test/smoke/smoke.mjs
